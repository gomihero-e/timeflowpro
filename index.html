<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeFlow Pro - タスク＆タイムトラッカー</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-app: #f8fafc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --warning: #f59e0b;
            --warning-bg: #fffbeb;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --radius: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-app: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #34d399;
            --success-bg: #064e3b;
            --danger: #f87171;
            --danger-bg: #7f1d1d;
            --warning: #fbbf24;
            --warning-bg: #78350f;
            --border: #334155;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
            transition: var(--transition);
            min-height: 100vh;
            display: flex;
        }

        .app-container {
            display: flex;
            width: 100%;
        }

        /* 固定サイドバー */
        .sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            transition: var(--transition);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
        }

        /* ナビゲーションメニュー */
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            background: none;
            border: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--primary);
            background-color: var(--bg-app);
        }

        .nav-item.active {
            font-weight: 600;
            box-shadow: inset 4px 0 0 0 var(--primary);
            border-radius: 0 8px 8px 0;
            padding-left: 20px;
        }

        .stats-panel {
            background-color: var(--bg-app);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: auto;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            font-feature-settings: "tnum";
        }

        .theme-toggle-zone {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .theme-switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
            cursor: pointer;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
        }

        .slider i {
            font-size: 11px;
            color: #fff;
            z-index: 1;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
            z-index: 2;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider::before {
            transform: translateX(22px);
        }

        /* メインコンテンツ（固定サイドバーの幅を確保） */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .view-section {
            display: none;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 0.2s ease forwards;
        }

        .view-section.active {
            display: flex;
        }

        /* ダッシュボードレイアウト */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .dash-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .dash-card-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background-color: var(--bg-app);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--primary);
        }

        .dash-card.success-card .dash-card-icon { color: var(--success); }

        .dash-card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dash-card-title {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .dash-card-value {
            font-size: 24px;
            font-weight: 700;
        }

        /* 入力カード */
        .input-card {
            background-color: var(--bg-card);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .input-main {
            flex: 2;
            min-width: 200px;
        }

        .input-date {
            flex: 1;
            min-width: 18px;
        }

        input[type="text"], input[type="datetime-local"] {
            width: 100%;
            background-color: var(--bg-app);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            font-family: inherit;
            white-space: nowrap;
        }

        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary); color: #fff; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: var(--border); color: var(--text-main); }
        .btn-secondary:hover { background-color: var(--text-muted); color: #fff; }
        .btn-danger { background-color: var(--danger); color: #fff; }
        .btn-danger:hover { opacity: 0.9; }

        /* タスクリスト表示 */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            transition: var(--transition);
            gap: 16px;
            animation: fadeIn 0.25s ease forwards;
        }

        .task-item:hover {
            transform: translateY(-1px);
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .checkbox-container {
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .checkbox-container input {
            position: absolute; opacity: 0; width: 0; height: 0;
        }

        .checkmark {
            height: 20px; width: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            display: inline-block;
            position: relative;
            transition: var(--transition);
        }

        .checkbox-container input:checked ~ .checkmark {
            background-color: var(--success);
            border-color: var(--success);
        }

        .checkmark::after {
            content: ""; position: absolute; display: none;
            left: 6px; top: 2px; width: 5px; height: 9px;
            border: solid white; border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .checkbox-container input:checked ~ .checkmark::after { display: block; }

        .task-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .task-name {
            font-size: 15px;
            font-weight: 500;
            word-break: break-all;
        }

        .task-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* カウントダウン・ステータスバッジ */
        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 11px;
        }
        .badge-info { background-color: var(--bg-app); color: var(--text-muted); }
        .badge-warning { background-color: var(--warning-bg); color: var(--warning); }
        .badge-danger { background-color: var(--danger-bg); color: var(--danger); }
        .badge-success { background-color: var(--success-bg); color: var(--success); }

        .task-item.completed { opacity: 0.6; }
        .task-item.completed .task-name { text-decoration: line-through; color: var(--text-muted); }

        .task-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time-box {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .time-display {
            font-family: monospace;
            font-size: 16px;
            font-weight: 600;
            min-width: 76px;
            text-align: right;
            font-feature-settings: "tnum";
        }

        .pulse-indicator {
            width: 6px; height: 6px; background-color: var(--success);
            border-radius: 50%; display: none;
        }

        .task-item.running .pulse-indicator {
            display: block; animation: pulse 1.5s infinite;
        }
        .task-item.running .time-display { color: var(--success); }

        .btn-action {
            width: 34px; height: 34px; border-radius: 6px; border: none;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            font-size: 13px; transition: var(--transition); background-color: var(--bg-app);
            color: var(--text-main);
        }
        .btn-action:hover { background-color: var(--border); }
        .task-item.running .btn-timer { background-color: var(--success-bg); color: var(--success); }
        .btn-trash:hover { background-color: var(--danger-bg); color: var(--danger); }

        /* カレンダー表示 */
        .calendar-wrapper {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .calendar-title {
            font-size: 18px;
            font-weight: 700;
        }

        .calendar-nav-btn {
            background: none; border: 1px solid var(--border);
            width: 32px; height: 32px; border-radius: 6px;
            cursor: pointer; color: var(--text-main); transition: var(--transition);
        }
        .calendar-nav-btn:hover { background-color: var(--bg-app); }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day-label {
            text-align: center; font-weight: 600; font-size: 12px;
            color: var(--text-muted); padding: 8px 0;
        }

        .calendar-cell {
            min-height: 90px; border: 1px solid var(--border);
            border-radius: 6px; padding: 6px; display: flex;
            flex-direction: column; gap: 4px; background-color: var(--bg-card);
            transition: var(--transition); cursor: pointer;
        }
        .calendar-cell:hover { background-color: var(--bg-app); }
        .calendar-cell.other-month { opacity: 0.3; }
        .calendar-cell.today { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
        .calendar-cell.selected { background-color: var(--success-bg); border-color: var(--success); }

        .cell-num { font-size: 11px; font-weight: 600; color: var(--text-muted); }
        .calendar-cell.today .cell-num { color: var(--primary); }

        .calendar-tasks { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .cal-task-dot {
            font-size: 10px; padding: 1px 4px; border-radius: 3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            background-color: var(--success-bg); color: var(--success);
            font-weight: 500;
        }

        /* モーダルポップアップ共通 */
        .modal-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background-color: rgba(0,0,0,0.4); display: none;
            align-items: center; justify-content: center; z-index: 200;
            animation: fadeIn 0.15s ease forwards;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background-color: var(--bg-card); border-radius: var(--radius);
            padding: 24px; width: 100%; max-width: 460px;
            box-shadow: var(--shadow); border: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 16px;
        }
        .modal-title { font-size: 16px; font-weight: 700; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }

        .empty-state {
            text-align: center; padding: 40px 20px; color: var(--text-muted);
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .empty-state i { font-size: 36px; color: var(--border); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @media (max-width: 850px) {
            .sidebar { width: 100%; position: relative; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
            .main-content { margin-left: 0; padding: 20px; }
            .app-container { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 固定左サイドバー -->
    <aside class="sidebar">
        <div class="logo-area">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>TimeFlow Pro</span>
        </div>

        <nav class="nav-menu">
            <button class="nav-item active" onclick="switchView('dashboard')" id="nav-dashboard">
                <i class="fa-solid fa-chart-pie"></i> ダッシュボード
            </button>
            <button class="nav-item" onclick="switchView('tasks')" id="nav-tasks">
                <i class="fa-solid fa-list-check"></i> タスク一覧
            </button>
            <button class="nav-item" onclick="switchView('calendar')" id="nav-calendar">
                <i class="fa-solid fa-calendar-days"></i> カレンダー確認
            </button>
        </nav>

        <div class="stats-panel">
            <div class="stat-item">
                <span class="stat-label">総計測時間</span>
                <span class="stat-value" id="totalTimeDisplay">00:00:00</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">完了済みタスク</span>
                <span class="stat-value" id="completedCountDisplay">0 / 0</span>
            </div>
        </div>

        <div class="theme-toggle-zone">
            <span class="stat-label" style="font-size: 13px;">ダークモード</span>
            <label class="theme-switch">
                <input type="checkbox" id="themeCheckbox">
                <span class="slider">
                    <i class="fa-solid fa-sun"></i>
                    <i class="fa-solid fa-moon"></i>
                </span>
            </label>
        </div>
    </aside>

    <!-- メインコンテンツ -->
    <main class="main-content">

        <!-- 1. ダッシュボードビュー -->
        <div id="view-dashboard" class="view-section active">
            <div class="dashboard-grid">
                <div class="dash-card">
                    <div class="dash-card-icon"><i class="fa-solid fa-stopwatch"></i></div>
                    <div class="dash-card-info">
                        <span class="dash-card-title">総稼働時間</span>
                        <span class="dash-card-value" id="dashTotalTime">00:00:00</span>
                    </div>
                </div>
                <div class="dash-card">
                    <div class="dash-card-icon" style="color: var(--warning);"><i class="fa-solid fa-hourglass-half"></i></div>
                    <div class="dash-card-info">
                        <span class="dash-card-title">未完了タスク</span>
                        <span class="dash-card-value" id="dashPendingCount">0</span>
                    </div>
                </div>
                <div class="dash-card success-card">
                    <div class="dash-card-icon"><i class="fa-solid fa-circle-check"></i></div>
                    <div class="dash-card-info">
                        <span class="dash-card-title">完了タスク</span>
                        <span class="dash-card-value" id="dashCompletedCount">0</span>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="section-title">期限が近い未完了タスク（直近3件）</h3>
                <ul class="task-list" id="dashUrgentList"></ul>
            </div>
        </div>

        <!-- 2. タスク一覧ビュー -->
        <div id="view-tasks" class="view-section">
            <div class="input-card">
                <div class="input-group">
                    <div class="input-main">
                        <input type="text" id="taskInput" placeholder="新しいタスク名を入力..." autocomplete="off">
                    </div>
                    <div class="input-date">
                        <input type="datetime-local" id="taskDeadline">
                    </div>
                    <button class="btn btn-primary" id="addTaskBtn"><i class="fa-solid fa-plus"></i> 追加</button>
                </div>
            </div>

            <div>
                <h3 class="section-title">すべてのタスク</h3>
                <ul class="task-list" id="mainTaskList"></ul>
            </div>
        </div>

        <!-- 3. カレンダー確認ビュー -->
        <div id="view-calendar" class="view-section">
            <div class="calendar-wrapper">
                <div class="calendar-header">
                    <button class="calendar-nav-btn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                    <h3 class="calendar-title" id="calendarMonthTitle">2026年 11月</h3>
                    <button class="calendar-nav-btn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- JSで挿入 -->
                </div>
            </div>
            
            <div id="calendarDayTasksSection" style="display:none;">
                <h3 class="section-title" id="selectedDayTitle">選択した日の完了タスク</h3>
                <ul class="task-list" id="calendarDayTaskList"></ul>
            </div>
        </div>

    </main>
</div>

<!-- 編集モーダル -->
<div class="modal-overlay" id="editModal">
    <div class="modal-box">
        <h4 class="modal-title"><i class="fa-regular fa-pen-to-square"></i> タスクの編集</h4>
        <input type="hidden" id="editTaskId">
        <div style="display:flex; flex-direction:column; gap:12px;">
            <div>
                <label class="stat-label">タスク名</label>
                <input type="text" id="editTaskName">
            </div>
            <div>
                <label class="stat-label">終了期限</label>
                <input type="datetime-local" id="editTaskDeadline">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('editModal')">キャンセル</button>
            <button class="btn btn-primary" onclick="saveTaskEdit()">変更を保存</button>
        </div>
    </div>
</div>

<!-- リセット確認モーダル -->
<div class="modal-overlay" id="resetModal">
    <div class="modal-box">
        <h4 class="modal-title" style="color:var(--danger);"><i class="fa-solid fa-triangle-exclamation"></i> タイマーのリセット確認</h4>
        <p style="font-size:14px; color:var(--text-muted); line-height:1.5;">
            このタスクのこれまでの計測時間をすべてクリアし、<strong style="color:var(--text-main);">00:00:00</strong> に戻しますか？この操作は取り消せません。
        </p>
        <input type="hidden" id="resetTaskId">
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('resetModal')">キャンセル</button>
            <button class="btn btn-danger" onclick="confirmTimerReset()">はい、リセットする</button>
        </div>
    </div>
</div>

<script>
    let tasks = [];
    let intervalId = null;
    let currentView = 'dashboard';
    
    // カレンダー状態
    let calDate = new Date();
    let selectedCalDayStr = null;

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
        initTheme();
        setDefaultDeadline();
        loadTasks();
        renderAll();
        startGlobalTicker();
    });

    // テーマ設定
    function initTheme() {
        const saved = localStorage.getItem('tf_theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
        themeCheckbox.checked = (saved === 'dark');
        themeCheckbox.addEventListener('change', () => {
            const theme = themeCheckbox.checked ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('tf_theme', theme);
        });
    }

    // デフォルト期限を翌日のこの時間に設定
    function setDefaultDeadline() {
        const now = new Date();
        now.setDate(now.getDate() + 1);
        // ローカルタイム用の日時文字列を生成 (YYYY-MM-DDTHH:MM)
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const date = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('taskDeadline').value = `${year}-${month}-${date}T${hours}:${minutes}`;
    }

    // ビュー切り替え
    function switchView(viewName) {
        currentView = viewName;
        document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
        
        document.getElementById(`nav-${viewName}`).classList.add('active');
        document.getElementById(`view-${viewName}`).classList.add('active');
        
        renderAll();
    }

    // タスク追加
    const addTaskBtn = document.getElementById('addTaskBtn');
    const taskInput = document.getElementById('taskInput');
    const taskDeadline = document.getElementById('taskDeadline');

    addTaskBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });

    function addTask() {
        const name = taskInput.value.trim();
        if (!name) return;

        const deadlineVal = taskDeadline.value;
        const newTask = {
            id: Date.now().toString(),
            name: name,
            deadline: deadlineVal ? new Date(deadlineVal).getTime() : null,
            elapsedTime: 0,
            isRunning: false,
            startTime: null,
            isCompleted: false,
            completedAt: null // 完了時のYMDを記録用
        };

        tasks.push(newTask);
        saveTasks();
        renderAll();
        taskInput.value = '';
        setDefaultDeadline();
    }

    // タイマー切り替え
    function toggleTimer(id) {
        const now = Date.now();
        tasks = tasks.map(task => {
            if (task.id === id) {
                if (task.isCompleted) return task;
                if (task.isRunning) {
                    const session = Math.floor((now - task.startTime) / 1000);
                    return { ...task, elapsedTime: task.elapsedTime + session, isRunning: false, startTime: null };
                } else {
                    return { ...task, isRunning: true, startTime: now };
                }
            }
            return task;
        });
        saveTasks();
        renderAll();
    }

    // タイマーリセット要求
    function openResetModal(id) {
        document.getElementById('resetTaskId').value = id;
        document.getElementById('resetModal').classList.add('active');
    }

    function confirmTimerReset() {
        const id = document.getElementById('resetTaskId').value;
        tasks = tasks.map(task => {
            if (task.id === id) {
                return { ...task, elapsedTime: 0, isRunning: false, startTime: null };
            }
            return task;
        });
        saveTasks();
        closeModal('resetModal');
        renderAll();
    }

    // タスク完了切り替え
    function toggleComplete(id) {
        const now = Date.now();
        tasks = tasks.map(task => {
            if (task.id === id) {
                const isCompleted = !task.isCompleted;
                let elapsed = task.elapsedTime;
                if (isCompleted && task.isRunning) {
                    elapsed += Math.floor((now - task.startTime) / 1000);
                }
                
                let completedAtStr = null;
                if (isCompleted) {
                    const d = new Date();
                    completedAtStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                }

                return {
                    ...task,
                    isCompleted: isCompleted,
                    elapsedTime: elapsed,
                    isRunning: false,
                    startTime: null,
                    completedAt: completedAtStr
                };
            }
            return task;
        });
        saveTasks();
        renderAll();
    }

    // タスク編集
    function openEditModal(id) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;

        document.getElementById('editTaskId').value = id;
        document.getElementById('editTaskName').value = task.name;
        
        if (task.deadline) {
            const d = new Date(task.deadline);
            const y = d.getFullYear();
            const m = String(d.getMonth()+1).padStart(2,'0');
            const date = String(d.getDate()).padStart(2,'0');
            const h = String(d.getHours()).padStart(2,'0');
            const min = String(d.getMinutes()).padStart(2,'0');
            document.getElementById('editTaskDeadline').value = `${y}-${m}-${date}T${h}:${min}`;
        } else {
            document.getElementById('editTaskDeadline').value = '';
        }
        
        document.getElementById('editModal').classList.add('active');
    }

    function saveTaskEdit() {
        const id = document.getElementById('editTaskId').value;
        const name = document.getElementById('editTaskName').value.trim();
        const dl = document.getElementById('editTaskDeadline').value;

        if (!name) return;

        tasks = tasks.map(task => {
            if (task.id === id) {
                return { ...task, name: name, deadline: dl ? new Date(dl).getTime() : null };
            }
            return task;
        });

        saveTasks();
        closeModal('editModal');
        renderAll();
    }

    function closeModal(modalId) {
        document.getElementById(modalId).classList.remove('active');
    }

    // 削除
    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        renderAll();
    }

    // 時間フォーマッタ
    function formatTime(sec) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
    }

    // 残り時間の計算とバッジ生成
    function getRemainingTimeBadge(deadline, isCompleted) {
        if (isCompleted) return `<span class="badge badge-success">完了済み</span>`;
        if (!deadline) return `<span class="badge badge-info">期限なし</span>`;

        const diff = deadline - Date.now();
        if (diff <= 0) return `<span class="badge badge-danger">期限切れ</span>`;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

        let text = '残り ';
        if (days > 0) text += `${days}日 `;
        text += `${hours}時間${mins}分`;

        if (days === 0 && hours < 1) {
            return `<span class="badge badge-danger">${text} 🔥</span>`;
        } else if (days === 0 && hours < 24) {
            return `<span class="badge badge-warning">${text}</span>`;
        }
        return `<span class="badge badge-info">${text}</span>`;
    }

    // 期限日時文字列フォーマッタ
    function formatDeadlineString(ts) {
        if (!ts) return 'なし';
        const d = new Date(ts);
        return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    // 1秒に1回走るリアルタイム同期
    function startGlobalTicker() {
        if (intervalId) clearInterval(intervalId);
        intervalId = setInterval(() => {
            const now = Date.now();
            let totalSec = 0;

            tasks.forEach(task => {
                let sec = task.elapsedTime;
                if (task.isRunning && task.startTime) {
                    sec += Math.floor((now - task.startTime) / 1000);
                    // メインリスト要素の更新
                    const el = document.getElementById(`time-${task.id}`);
                    if (el) el.textContent = formatTime(sec);
                    // ダッシュボード内要素の更新
                    const elDash = document.getElementById(`time-dash-${task.id}`);
                    if (elDash) elDash.textContent = formatTime(sec);
                    // カレンダー内要素の更新
                    const elCal = document.getElementById(`time-cal-${task.id}`);
                    if (elCal) elCal.textContent = formatTime(sec);
                }
                totalSec += sec;
            });

            const formatted = formatTime(totalSec);
            totalTimeDisplay.textContent = formatted;
            if (document.getElementById('dashTotalTime')) {
                document.getElementById('dashTotalTime').textContent = formatted;
            }
        }, 1000);
    }

    // タスクHTMLカード生成共通
    function createTaskItemHTML(task, idPrefix = 'time-') {
        const now = Date.now();
        let total = task.elapsedTime;
        if (task.isRunning && task.startTime) {
            total += Math.floor((now - task.startTime) / 1000);
        }

        return `
            <li class="task-item ${task.isRunning ? 'running' : ''} ${task.isCompleted ? 'completed' : ''}">
                <div class="task-left">
                    <label class="checkbox-container">
                        <input type="checkbox" ${task.isCompleted ? 'checked' : ''} onchange="toggleComplete('${task.id}')">
                        <span class="checkmark"></span>
                    </label>
                    <div class="task-details">
                        <span class="task-name">${escapeHTML(task.name)}</span>
                        <div class="task-meta">
                            <span><i class="fa-regular fa-calendar"></i> 期限: ${formatDeadlineString(task.deadline)}</span>
                            ${getRemainingTimeBadge(task.deadline, task.isCompleted)}
                        </div>
                    </div>
                </div>
                <div class="task-right">
                    <div class="time-box">
                        <span class="pulse-indicator"></span>
                        <span id="${idPrefix}${task.id}" class="time-display">${formatTime(total)}</span>
                    </div>
                    <button class="btn-action btn-timer" onclick="toggleTimer('${task.id}')" title="スタート/ストップ" ${task.isCompleted ? 'disabled style="opacity:0.3; cursor:not-allowed;"' : ''}>
                        <i class="fa-solid ${task.isRunning ? 'fa-pause' : 'fa-play'}"></i>
                    </button>
                    <button class="btn-action" onclick="openEditModal('${task.id}')" title="編集"><i class="fa-solid fa-pen"></i></button>
                    <button class="btn-action" onclick="openResetModal('${task.id}')" title="計測リセット"><i class="fa-solid fa-rotate-right" style="transform: scaleX(-1);"></i></button>
                    <button class="btn-action btn-trash" onclick="deleteTask('${task.id}')" title="削除"><i class="fa-regular fa-trash-can"></i></button>
                </div>
            </li>
        `;
    }

    // 全描画ハブ
    function renderAll() {
        // 統計更新
        const totalCount = tasks.length;
        const completedCount = tasks.filter(t => t.isCompleted).length;
        const pendingCount = totalCount - completedCount;

        completedCountDisplay.textContent = `${completedCount} / ${totalCount}`;
        
        // 計測時間のベース計算
        let totalSec = 0;
        const now = Date.now();
        tasks.forEach(t => {
            totalSec += t.elapsedTime;
            if (t.isRunning && t.startTime) totalSec += Math.floor((now - t.startTime) / 1000);
        });
        totalTimeDisplay.textContent = formatTime(totalSec);

        // ビュー別の描画
        if (currentView === 'dashboard') {
            document.getElementById('dashTotalTime').textContent = formatTime(totalSec);
            document.getElementById('dashPendingCount').textContent = pendingCount;
            document.getElementById('dashCompletedCount').textContent = completedCount;

            // 直近3件（未完了 ＆ 期限あり を最優先にソート）
            const urgentTasks = tasks
                .filter(t => !t.isCompleted)
                .sort((a, b) => {
                    if (!a.deadline) return 1;
                    if (!b.deadline) return -1;
                    return a.deadline - b.deadline;
                })
                .slice(0, 3);

            const urgentList = document.getElementById('dashUrgentList');
            if (urgentTasks.length === 0) {
                urgentList.innerHTML = `<div class="empty-state"><i class="fa-solid fa-circle-check"></i><p>現在、急ぎの未完了タスクはありません。</p></div>`;
            } else {
                urgentList.innerHTML = urgentTasks.map(t => createTaskItemHTML(t, 'time-dash-')).join('');
            }
        } 
        else if (currentView === 'tasks') {
            // ソートロジック: 未完了が上、完了が下。それぞれの中で期限が近い順
            const sortedTasks = [...tasks].sort((a, b) => {
                if (a.isCompleted !== b.isCompleted) return a.isCompleted ? 1 : -1;
                if (!a.deadline) return 1;
                if (!b.deadline) return -1;
                return a.deadline - b.deadline;
            });

            const mainList = document.getElementById('mainTaskList');
            if (sortedTasks.length === 0) {
                mainList.innerHTML = `<div class="empty-state"><i class="fa-regular fa-folder-open"></i><p>タスクが登録されていません。</p></div>`;
            } else {
                mainList.innerHTML = sortedTasks.map(t => createTaskItemHTML(t, 'time-')).join('');
            }
        } 
        else if (currentView === 'calendar') {
            renderCalendar();
        }
    }

    // カレンダー描画
    function changeMonth(offset) {
        calDate.setMonth(calDate.getMonth() + offset);
        renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const title = document.getElementById('calendarMonthTitle');
        grid.innerHTML = '';

        const year = calDate.getFullYear();
        const month = calDate.getMonth();
        title.textContent = `${year}年 ${month + 1}月`;

        // 曜日のラベル挿入
        const dayLabels = ['日', '月', '火', '水', '木', '金', '土'];
        dayLabels.forEach(l => {
            const div = document.createElement('div');
            div.className = 'calendar-day-label';
            div.textContent = l;
            grid.appendChild(div);
        });

        // 月の最初の日と最後の日
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        
        // グリッド開始のための前月の埋め要素
        const startDayOfWeek = firstDay.getDay();
        const prevLastDay = new Date(year, month, 0).getDate();

        for (let i = startDayOfWeek - 1; i >= 0; i--) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell other-month';
            cell.innerHTML = `<span class="cell-num">${prevLastDay - i}</span>`;
            grid.appendChild(cell);
        }

        // 当月の日付を埋める
        const todayStr = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}`;

        for (let d = 1; d <= lastDay.getDate(); d++) {
            const currentDayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const cell = document.createElement('div');
            cell.className = 'calendar-cell';
            if (currentDayStr === todayStr) cell.classList.add('today');
            if (currentDayStr === selectedCalDayStr) cell.classList.add('selected');

            cell.innerHTML = `<span class="cell-num">${d}</span><div class="calendar-tasks" id="cal-box-${currentDayStr}"></div>`;
            
            // クリックイベント
            cell.onclick = () => selectCalendarDay(currentDayStr);
            grid.appendChild(cell);

            // この日に【完了】したタスクをマッピング（期限日は無視）
            const dayDoneTasks = tasks.filter(t => t.isCompleted && t.completedAt === currentDayStr);
            const box = cell.querySelector('.calendar-tasks');
            dayDoneTasks.slice(0, 3).forEach(t => {
                const item = document.createElement('span');
                item.className = 'cal-task-dot';
                item.textContent = t.name;
                box.appendChild(item);
            });
            if (dayDoneTasks.length > 3) {
                const more = document.createElement('span');
                more.className = 'cal-task-dot';
                more.style.background = 'none';
                more.style.color = 'var(--text-muted)';
                more.textContent = `他 ${dayDoneTasks.length - 3} 件`;
                box.appendChild(more);
            }
        }

        // 後月の埋め要素（計42マスの帳尻合わせ）
        const totalCells = startDayOfWeek + lastDay.getDate();
        const nextMonthCells = (7 - (totalCells % 7)) % 7;
        for (let i = 1; i <= nextMonthCells; i++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell other-month';
            cell.innerHTML = `<span class="cell-num">${i}</span>`;
            grid.appendChild(cell);
        }

        // もし選択中の日があれば詳細エリアを更新、なければ隠す
        if (selectedCalDayStr) {
            updateCalendarDayDetails();
        } else {
            document.getElementById('calendarDayTasksSection').style.display = 'none';
        }
    }

    function selectCalendarDay(dayStr) {
        selectedCalDayStr = dayStr;
        // セルの選択状態ハイライトの更新のためにカレンダーを再描画
        renderCalendar();
    }

    function updateCalendarDayDetails() {
        const section = document.getElementById('calendarDayTasksSection');
        const list = document.getElementById('calendarDayTaskList');
        const title = document.getElementById('selectedDayTitle');

        const [y, m, d] = selectedCalDayStr.split('-');
        title.textContent = `${parseInt(y)}年${parseInt(m)}月${parseInt(d)}日 に完了したタスク`;

        const dayDoneTasks = tasks.filter(t => t.isCompleted && t.completedAt === selectedCalDayStr);
        
        section.style.display = 'block';
        if (dayDoneTasks.length === 0) {
            list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-clipboard-list"></i><p>この日に完了したタスクはありません。</p></div>`;
        } else {
            list.innerHTML = dayDoneTasks.map(t => createTaskItemHTML(t, 'time-cal-')).join('');
        }
    }

    // データ保存・読み込み
    function saveTasks() { localStorage.setItem('tf_tasks_v2', JSON.stringify(tasks)); }
    function loadTasks() {
        const stored = localStorage.getItem('tf_tasks_v2');
        if (stored) { try { tasks = JSON.parse(stored); } catch (e) { tasks = []; } }
    }

    // エスケープ
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
</script>

</body>
</html>
